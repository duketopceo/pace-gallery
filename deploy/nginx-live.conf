# Static origin for the Pace Gallery.
#
# This file is the whole runtime. There is no application server, no database and no
# credential in this container: it reads a directory of files and returns bytes. The
# security posture of the published site is therefore entirely in the headers below.
#
# Cache policy follows the build: everything under /assets/ is content-hashed by the
# bundler (card-*-<hash>.js, style-<hash>.css), so it can be cached for a year and never
# revalidated. index.html is the one file whose name is stable, so it must revalidate or
# a deploy would not be visible to anyone holding a cached copy.
#
# The content security policy is strict because the build allows it. The built bundle has
# one external module script and no inline <script>, no inline <style>, no Worker, no
# blob: URL, no WebAssembly and no eval(). So 'self' is genuinely sufficient, and
# default-src 'none' denies everything the page does not need. A future card that wants
# to fetch or eval will fail loudly here instead of quietly widening the policy.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    absolute_redirect off;

    # Do not advertise the origin software.
    server_tokens off;

    # The document is generated at build time and is not user input, but a static origin
    # should still never be talked into serving a directory listing or a dotfile.
    autoindex off;
    location ~ /\. {
        deny all;
        return 404;
    }

    # ---- security headers -------------------------------------------------------
    # frame-ancestors 'none' is also a licence control, not only a clickjacking control.
    # The MIT notices must accompany the redistributed code, and a framed document
    # cannot be audited, so refusing to be framed keeps the notice in the reader's view.

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy   "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # ---- cache policy -----------------------------------------------------------
    # add_header in a location block replaces the inherited set, so every location that
    # wants the security headers above has to repeat them. The repetition is deliberate:
    # an nginx 'add_header' inheritance mistake that silently drops a security header is
    # a worse outcome than a little duplication. deploy-check.sh fails the build if a
    # location block sets Cache-Control without also carrying the security headers.

    location /assets/ {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # Hashed filenames: cache hard, never revalidate.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else, which in practice means index.html and the licence notices.
    location / {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy   "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # The document itself must revalidate so a deploy is visible immediately.
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ /index.html =404;
    }

    # Uptime check target. Returns 200 with a known body and never touches the filesystem,
    # so it keeps answering when the site is broken, which is the whole point of a check
    # that distinguishes "the host is up" from "the site is up".
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok: pace gallery is live\n";
    }
}
