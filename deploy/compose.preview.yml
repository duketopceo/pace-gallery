# Origin for ONE pull-request preview.
#
# This is not the live origin and it never runs next to it. It is a separate compose
# project, started by scripts/preview.sh with a per-pull-request project name, serving one
# directory on one exact hostname.
#
# The exact hostname is not a stylistic choice. traefik derives the names it asks Let's
# Encrypt for from the router rule, and it will not turn a HostRegexp into a certificate:
# ACME cannot validate a pattern. A regex-matched preview router therefore serves
# traefik's default self-signed certificate, which Cloudflare rejects with a 526, and the
# preview silently never comes up. A per-pull-request router with `Host(pr-42.pacehq.io)`
# gets a real certificate, and it is also a stricter boundary: this preview can only ever
# answer for its own name.
#
# Because each preview is its own project, tearing one down is `docker compose -p <project>
# down`, and it cannot take anything else with it.
#
# Required environment (scripts/preview.sh sets both):
#   PREVIEW_HOST   the exact hostname, e.g. pr-42.pacehq.io
#   PREVIEW_DIR    host directory holding that pull request's built site
#
# Hardening matches the live origin, and deploy-check.sh enforces it: this container serves
# unreviewed pull-request code, so read_only, no-new-privileges and cap_drop are the
# controls that keep that code from becoming a foothold on a host that also runs the company
# password manager and database.

name: ${PREVIEW_PROJECT:-pace-gallery-preview}

services:
  preview:
    image: nginx:1.29-alpine
    container_name: pace-gallery-pr-${PREVIEW_NUMBER:?set PREVIEW_NUMBER}
    restart: unless-stopped
    read_only: true
    init: true
    user: "101:101"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /var/cache/nginx:mode=0700,uid=101,gid=101
      - /var/run:mode=0755,uid=101,gid=101
      - /tmp:mode=1777
    networks:
      - pace-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${PREVIEW_DIR:?set PREVIEW_DIR}:/usr/share/nginx/html:ro
      - ./nginx-preview.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gallery-preview.rule=Host(`${PREVIEW_HOST:?set PREVIEW_HOST}`)"
      - "traefik.http.routers.gallery-preview.entrypoints=${PACE_TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.gallery-preview.tls.certresolver=letsencrypt"
      # Explicit, so this router cannot be reordered against the product's catch-all
      # HostRegexp router by an implicit rule-length tiebreak.
      - "traefik.http.routers.gallery-preview.priority=890"
      - "traefik.http.routers.gallery-preview.service=pace-gallery-pr-${PREVIEW_NUMBER}"
      - "traefik.http.services.pace-gallery-pr-${PREVIEW_NUMBER}.loadbalancer.server.port=8080"

networks:
  pace-internal:
    external: true
    name: pace-internal
