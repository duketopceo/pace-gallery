# Origin for the Pace Gallery.
#
# Scope: this is the *origin* only. TLS, DNS and the public hostname are terminated and
# served through Cloudflare; this container listens on a private Docker network and is
# never addressed directly.
#
# Why it lives here and not in the product stack's compose file: the gallery is a
# marketing asset with its own release cadence and its own blast radius. It gets its own
# directory, its own compose project and its own hardened services, so nothing here can
# be affected by a product deploy and no product deploy can be affected by this one. The
# one thing it shares with the product is the `pace-internal` network, and it shares that
# only because the traefik docker provider is configured to watch that network. There is
# no route from this container to the product databases: it holds no credentials, mounts
# nothing but a directory of static files, and the containers it could reach hold the
# credentials, not the other way round.
#
# Hardening is not decoration here. This serves a public marketing page from the same
# host as Vaultwarden, Mattermost, Grafana and the company database, so "it is only static
# files" is a claim that has to be enforced, not assumed:
#
#   read_only        the container cannot write to its own filesystem
#   no-new-privileges  a process in here cannot gain privilege
#   cap_drop: ALL     no Linux capabilities at all, not even the ones nginx does not need
#   tmpfs /var/cache, /var/run  the only writable paths are tmpfs, and they hold no data
#   nginx user       the worker processes do not run as root
#
# deploy-check.sh fails the build if any of those regress.

name: pace-components

# The hardening below is not decoration. This origin shares a host with Vaultwarden,
# Mattermost, Grafana and the company database, so "it only serves static files" is a claim
# that has to be enforced rather than assumed:
#
#   read_only           the container cannot write to its own filesystem
#   no-new-privileges   a process in here cannot gain privilege
#   cap_drop: ALL       no Linux capabilities at all, not even the ones nginx does not need
#   tmpfs               the only writable paths are tmpfs, and they hold no data
#   user                the worker processes do not run as root
#
# deploy-check.sh fails the build if any of those regress.

x-hardened: &hardened
  image: nginx:1.29-alpine
  restart: unless-stopped
  read_only: true
  init: true
  user: "101:101"
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /var/cache/nginx:mode=0700,uid=101,gid=101
    - /var/run:mode=0755,uid=101,gid=101
    - /tmp:mode=1777
  networks:
    - pace-internal
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # The published gallery. https://components.pacehq.io
  live:
    <<: *hardened
    container_name: pace-gallery-live
    volumes:
      - ./www/live:/usr/share/nginx/html:ro
      - ./nginx-live.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gallery.rule=Host(`${PACE_GALLERY_HOST:-components.pacehq.io}`)"
      - "traefik.http.routers.gallery.entrypoints=${PACE_TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.gallery.tls.certresolver=letsencrypt"
      # Explicit so this router cannot be reordered against the product's catch-all
      # HostRegexp router by a rule-length tiebreak. A shadowed product route is a
      # production outage, and an implicit priority is not a control.
      - "traefik.http.routers.gallery.priority=900"
      - "traefik.http.routers.gallery.service=pace-gallery-live"
      - "traefik.http.services.pace-gallery-live.loadbalancer.server.port=8080"

  # Per-pull-request previews live in deploy/compose.preview.yml, one compose project per
  # pull request. They are not services here on purpose: traefik derives the names it asks
  # Let's Encrypt for from the router rule, and it cannot turn a HostRegexp into a
  # certificate, so a shared regex-matched preview router serves traefik's default
  # self-signed certificate and Cloudflare rejects it with a 526. One exact-host router per
  # pull request gets a real certificate, and draws a tighter boundary besides.

networks:
  pace-internal:
    external: true
    name: pace-internal
