# Static origin for ONE pull-request preview.
#
# This is the most security-sensitive file in the repository, because it serves unreviewed
# pull-request code. Two rules shape it.
#
# One: a preview must never be able to affect the published gallery, so it is a different
# hostname (pr-42.pacehq.io, a separate origin) in a separate container with a separate
# document root. A sub-path on components.pacehq.io would not be a separate origin, and
# would hand every pull request same-origin access to the live site.
#
# Two: nothing is published until scripts/preview.sh has run the same gates production runs.
# A preview that skipped the compliance suite would be worse than no preview, because
# reviewers would be reviewing an unverified build.
#
# The server_name is the exact preview hostname. It is passed in rather than matched with a
# pattern because traefik requests its certificate from this router's rule: a pattern would
# leave the origin on a self-signed certificate and Cloudflare would refuse it.

server {
    listen      8080;
    server_name ${PREVIEW_HOST};

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    absolute_redirect off;
    server_tokens off;
    autoindex off;

    location ~ /\. {
        deny all;
        return 404;
    }

    # ---- headers ----------------------------------------------------------------
    # Same strict CSP as the live site: one external module script, no inline script or
    # style, no Worker, no blob:, no WebAssembly, no eval().
    #
    # X-Robots-Tag is the one addition. A preview is an unreviewed build of unreviewed code
    # on a subdomain of a company domain, and it must not end up in a search index.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options        "nosniff" always;
    add_header X-Frame-Options               "DENY" always;
    add_header Referrer-Policy               "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy    "same-origin" always;
    add_header Cross-Origin-Resource-Policy  "same-origin" always;
    add_header X-Robots-Tag                  "noindex, nofollow" always;

    # Same policy as production, and the same two cases.
    #
    # /assets/ filenames are content-hashed, so a year of immutable caching is safe: the hash
    # is a function of the content, so a changed build gets a changed name and an immutable
    # cached asset can never be stale.
    location /assets/ {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options        "nosniff" always;
        add_header X-Frame-Options               "DENY" always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy    "same-origin" always;
        add_header Cross-Origin-Resource-Policy  "same-origin" always;
        add_header X-Robots-Tag                  "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The document itself must revalidate, and for a preview this matters more than anywhere
    # else: its whole purpose is to show a reviewer the current state of a pull request, so a
    # cached index.html would show them the previous build and quietly review the wrong thing.
    location / {
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options        "nosniff" always;
        add_header X-Frame-Options               "DENY" always;
        add_header Referrer-Policy               "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy    "same-origin" always;
        add_header Cross-Origin-Resource-Policy  "same-origin" always;
        add_header X-Robots-Tag                  "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ /index.html =404;
    }
}
