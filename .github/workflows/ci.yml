name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build and enforce the per-card byte budget
        run: npm run build:check

      # The card byte figures are printed on the page and committed to the repository. If a build
      # changes them, the page is now lying about its own cost, so the build must not silently
      # rewrite the committed report.
      - name: The committed byte report must match the bundle
        run: |
          if ! git diff --exit-code -- src/lib/card-bytes.json; then
            echo "::error::src/lib/card-bytes.json is stale. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: The vendored tree must match the published tarball
        run: npm run vendor:check

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: pace-gallery-dist
          path: dist/
          retention-days: 7
